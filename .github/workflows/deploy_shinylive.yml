# Builds the Shiny app to WebAssembly with shinylive and publishes it to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy Ingenuity Shiny app

on:
  push:
    branches: [main]
    paths:
      - "ingenuity-shiny/**"
      - ".github/workflows/deploy_shinylive.yml"
      - "pages/**"
      - "scripts/precompile_shiny_css.R"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::plotly
            any::dplyr
            any::glue
            any::reactable

      # Compile the app's Bootstrap/Sass CSS natively; compiling it in the
      # browser (webR) more than doubled the app's startup time.
      - name: Precompile theme CSS
        run: Rscript scripts/precompile_shiny_css.R

      - name: Export shinylive app
        run: shinylive::export(appdir = "ingenuity-shiny", destdir = "site")
        shell: Rscript {0}

      - name: Add 404 fallback (reloads once if the service worker wasn't ready)
        run: cp pages/404.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
