<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Ingenuity Flight Log</title>
<style>
  body { margin: 0; background: #0a0a0f; color: #e0e0e0;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { max-width: 36rem; padding: 1.5rem; }
  a { color: #4ECDC4; }
  ol { padding-left: 1.2rem; }
  details { margin-top: 1rem; color: #8c8ca0; font-size: 13px; }
  pre { white-space: pre-wrap; word-break: break-all; background: #111122;
        border: 1px solid #2a2a3a; border-radius: 6px; padding: 8px; user-select: all; }
</style>
</head>
<body>
<main id="msg">Starting the app…</main>
<script>
// Shinylive serves the app's pages (app_*/) from a service worker. GitHub
// only serves this page when that request reached the network instead, which
// means the worker didn't handle it. Recover in steps, at most once each per
// two minutes so this can't loop:
//   1. reload the whole app (the worker may just not have been ready);
//   2. unregister the worker and reload (a stale or stuck worker left over
//      from an earlier visit is re-installed fresh);
//   3. give up and explain, with details for debugging.
(async function () {
  var path = location.pathname;
  var inApp = /\/app_[^/]+\//.test(path);
  var home = path.split("/app_")[0] + "/";
  var msg = document.getElementById("msg");
  if (!inApp) {
    msg.innerHTML = "Page not found. <a href='" + home + "' target='_top'>Go to the Ingenuity Flight Log</a>.";
    return;
  }

  var KEY = "shinylive-404-recovery", WINDOW = 120000;
  var state = { step: 0, t: 0, log: [] };
  try { state = JSON.parse(sessionStorage.getItem(KEY)) || state; } catch (e) {}
  if (Date.now() - state.t > WINDOW) state = { step: 0, t: 0, log: [] };

  async function diagnose() {
    var d = { at: new Date().toISOString(), step: state.step };
    try {
      var sw = navigator.serviceWorker;
      d.swSupported = !!sw;
      if (sw) {
        var top = window.top.navigator.serviceWorker;
        d.topControlled = top && top.controller ? top.controller.state + " " + top.controller.scriptURL : "no";
        d.frameControlled = sw.controller ? sw.controller.state : "no";
        var regs = await sw.getRegistrations();
        d.registrations = regs.map(function (r) {
          return r.scope + " active=" + (r.active ? r.active.state : "-") +
                 " waiting=" + (r.waiting ? r.waiting.state : "-") +
                 " installing=" + (r.installing ? r.installing.state : "-");
        });
      }
    } catch (e) { d.error = String(e); }
    d.ua = navigator.userAgent;
    return d;
  }
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  state.log.push(await diagnose());

  if (state.step === 0) {
    state.step = 1; state.t = Date.now(); save();
    window.top.location.reload();
    return;
  }
  if (state.step === 1 && navigator.serviceWorker) {
    state.step = 2; state.t = Date.now(); save();
    msg.textContent = "Resetting the app's service worker…";
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    } catch (e) {}
    window.top.location.reload();
    return;
  }

  msg.innerHTML =
    "<p><strong>The app couldn't start in this browser.</strong> It runs R in the page " +
    "and needs a service worker, which didn't take over the app's frame.</p>" +
    "<ol><li>Private Browsing windows can't run it; use a normal window.</li>" +
    "<li>In Safari, clear this site's data: Settings › Privacy › Manage Website Data, " +
    "search <em>github.io</em>, select <em>eschnitger.github.io</em>, Remove. " +
    "Then <a href='" + home + "' target='_top'>reload the app</a>.</li>" +
    "<li>Or open it in Chrome or Firefox.</li></ol>" +
    "<details><summary>Technical details</summary><pre></pre></details>";
  msg.querySelector("pre").textContent = JSON.stringify(state.log, null, 1);
})();
</script>
</body>
</html>
